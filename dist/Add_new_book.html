<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="/output.css" rel="stylesheet">
    <title>Add New Book</title>
    <style>
        .main-content-wrapper {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .page-content {
            flex: 1;
        }
    </style>
</head>
<body class="bg-zinc-50">
    <div class="main-content-wrapper">
        <div class="flex flex-1">
            <!-- Mobile Menu Button -->
            <button id="sidebar-toggle" class="md:hidden fixed top-2 right-4 z-20 p-2 rounded-md text-teal-900 bg-white shadow-md">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <!-- Sidebar -->
            <div id="sidebar" class="fixed lg:w-64 md:w-54 h-full bg-[#FFFCF5] shadow-md transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out z-10 overflow-y-auto">
                <div class="p-4">
                    <div class="flex items-center mb-8">
                        <img src="/Cart assets/Logo (1).svg" alt="Logo" class="w-7 h-7 mr-2">
                        <span class="text-teal-900 text-lg font-bold font-['Inter'] uppercase">Logo Here</span>
                    </div>
                    <nav class="space-y-2">
                        <button class="w-full flex items-center px-3 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors">
                            <img src="/Cart assets/3d-square.svg" alt="Products" class="w-4 h-4 mr-3">
                            <span class="text-teal-900 text-sm font-medium">Products</span>
                        </button>
                        <button class="w-full flex items-center px-3 py-2 hover:bg-gray-100 rounded-lg transition-colors">
                            <img src="/Cart assets/element-4.svg" alt="My Orders" class="w-4 h-4 mr-3">
                            <span class="text-gray-800 text-sm font-medium">My Order</span>
                        </button>
                        <button class="w-full flex items-center px-3 py-2 hover:bg-gray-100 rounded-lg transition-colors">
                            <img src="/Cart assets/headphone.svg" alt="My Orders" class="w-4 h-4 mr-3">
                            <span class="text-gray-800 text-sm font-medium">AI Support</span>
                        </button>
                        <button class="w-full flex items-center px-3 py-2 hover:bg-gray-100 rounded-lg transition-colors">
                            <img src="/Cart assets/setting-2.svg" alt="Settings" class="w-4 h-4 mr-3">
                            <span class="text-gray-800 text-sm font-medium">Settings</span>
                        </button>
                    </nav>
                </div>
            </div>

            <!-- Main Content -->
            <div class="content-area w-full md:ml-54 lg:ml-64">
                <div class="page-content relative p-4 md:p-8 flex flex-col pb-24">
                    <!-- Header -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 md:mb-6">
                        <div class="flex items-center">
                            <h1 class="text-xl md:text-2xl font-bold text-teal-900">Add New Book</h1>
                        </div>
                        <div class="hidden md:flex items-center space-x-4">
                            <div class="relative md:hidden">
                                <input type="text" placeholder="Search..." class="pl-4 pr-10 py-2 bg-gray-100 rounded-full text-sm focus:outline-none w-64">
                                <svg class="w-4 h-4 text-gray-400 absolute right-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </div>
                            <button class="p-2 md:hidden text-gray-500 hover:text-teal-900 focus:outline-none">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                                </svg>
                            </button>
                            <div class="flex items-center space-x-2">
                                <div class="w-8 h-8 rounded-full bg-gray-200 overflow-hidden">
                                    <img src="/Cart assets/Place image here.png" alt="Profile" class="w-full h-full object-cover">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="w-full xl:flex-1 xl:flex xl:items-center">
                        <div class="flex flex-col pt-8 xl:pt-0 lg:flex-row gap-4 md:gap-6 xl:gap-8 w-full">
                            <!-- Left Column -->
                            <div class="w-full lg:w-1/2 bg-white rounded-lg shadow-sm p-4 lg:p-4 md:p-6">
                                <h2 class="text-2xl font-bold text-teal-900 mb-6">General Information</h2>
                                <div class="space-y-6">
                                    <div>
                                        <label class="block text-teal-900 text-base font-medium mb-2">Product Name</label>
                                        <input type="text" class="w-full h-11 bg-zinc-50 rounded-md border border-gray-300 px-4 focus:outline-none focus:border-gray-300" placeholder="Enter product name">
                                    </div>
                                    <div>
                                        <label class="block text-teal-900 text-base font-medium mb-2">Product Details</label>
                                        <textarea class="w-full min-h-[150px] md:min-h-[200px] bg-zinc-50 rounded-md border border-gray-300 p-4 focus:outline-none focus:border-gray-300" placeholder="Enter details"></textarea>
                                    </div>
                                    <div class="grid grid-cols-2 sm:grid-cols-2 gap-4 md:gap-6">
                                        <div class="w-full">
                                            <label class="block text-teal-900 text-base font-medium mb-2">Price</label>
                                            <input type="text" class="w-full h-11 bg-zinc-50 rounded-md border border-gray-300 px-4 focus:outline-none focus:border-gray-300" placeholder="$$$">
                                        </div>
                                        <div class="w-full">
                                            <label class="block text-teal-900 text-base font-medium mb-2">Category</label>
                                            <input type="text" class="w-full h-11 bg-zinc-50 rounded-md border border-gray-300 px-4 focus:outline-none focus:border-gray-300" placeholder="Category">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Right Column -->
                            <div class="w-full lg:w-1/2 space-y-4 md:space-y-6">
                                <!-- Image Upload -->
                                <div class="bg-white rounded-lg shadow-sm p-4 md:p-6">
                                    <h2 class="text-2xl font-bold text-teal-900 mb-3 mt-[-15px]">Upload Image</h2>
                                    <div class="border-2 border-dashed border-gray-300 rounded-lg lg:p-2 md:p-6 text-center">
                                        <div class="flex flex-col items-center justify-center gap-4">
                                            <img src="/Cart assets/cloud-add.svg" alt="Upload" class="w-10 h-10">
                                            <div class="space-y-1">
                                                <p class="text-base md:text-lg font-semibold text-zinc-800">Choose a file or drag & drop it here</p>
                                                <p class="text-xs md:text-sm text-gray-400">JPEG, PNG formats, up to 10MB</p>
                                            </div>
                                            <button type="button" class="text-teal-700 text-sm md:text-base font-medium hover:text-teal-800 focus:outline-none mt-2">
                                                Browse File
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <!-- File Upload -->
                                <div class="bg-white rounded-lg shadow-sm p-4 md:p-6">
                                    <h2 class="text-2xl font-bold text-teal-900 mb-3 mt-[-15px]">Upload File</h2>
                                    <div class="border-2 border-dashed border-gray-300 rounded-lg lg:p-2 md:p-6 text-center">
                                        <div class="flex flex-col items-center justify-center gap-4">
                                            <img src="/Cart assets/cloud-add.svg" alt="Upload" class="w-10 h-10">
                                            <div class="space-y-1">
                                                <p class="text-base md:text-lg font-semibold text-zinc-800">Choose a file or drag & drop it here</p>
                                                <p class="text-xs md:text-sm text-gray-400">PDF or Zip File formats, up to 100MB</p>
                                            </div>
                                            <button type="button" class="text-teal-700 text-sm md:text-base font-medium hover:text-teal-800 focus:outline-none mt-2">
                                                Browse File
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <!-- Save Button (inside right column) -->
                                <div class="flex justify-end mt-6">
                                    <button id="save-btn" type="button"
                                        class="inline-flex items-center gap-2 bg-[#1E4841] hover:bg-[#1E4841]/80 text-white font-medium px-7 md:px-8 py-2.5 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1E4841] min-w-[150px] md:min-w-[180px] justify-center">
                                        Save
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <footer class="bg-white border-t border-gray-200 py-4 px-4 md:px-8 w-full">
                    <div class="flex flex-col md:flex-row justify-between items-center">
                        <div class="text-center md:text-left mb-4 md:mb-0">
                            <p class="text-sm text-gray-600">Copyright 2025 book.com</p>
                        </div>
                        <div class="flex flex-wrap justify-center gap-4">
                            <a href="#" class="text-sm text-gray-600 hover:text-teal-900">Privacy Policy</a>
                            <a href="#" class="text-sm text-gray-600 hover:text-teal-900">Terms of Service</a>
                            <a href="#" class="text-sm text-gray-600 hover:text-teal-900">Contact Us</a>
                        </div>
                        <div class="flex space-x-4 mt-4 md:mt-0">
                            <a href="#" class="text-gray-500 hover:text-teal-900">
                                <img src="/Cart assets/FacebookLogo.svg" alt="Facebook" class="w-5 h-5">
                            </a>
                            <a href="#" class="text-gray-500 hover:text-teal-900">
                                <img src="/Cart assets/TwitterLogo.svg" alt="Twitter" class="w-5 h-5">
                            </a>
                            <a href="#" class="text-gray-500 hover:text-teal-900">
                                <img src="/Cart assets/InstagramLogo.svg" alt="Instagram" class="w-5 h-5">
                            </a>
                            <a href="#" class="text-gray-500 hover:text-teal-900">
                                <img src="/Cart assets/YoutubeLogo.svg" alt="YouTube" class="w-5 h-5">
                            </a>
                            <a href="#" class="text-gray-500 hover:text-teal-900">
                                <img src="/Cart assets/LinkedinLogo.svg" alt="Linkedin" class="w-5 h-5">
                            </a>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
    </div>

    <script>
        // Toggle sidebar on mobile
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.querySelector('.main-content-wrapper');

        sidebarToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            sidebar.classList.toggle('-translate-x-full');
            sidebar.classList.toggle('shadow-lg');
        });

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', (e) => {
            if (window.innerWidth < 768 && !sidebar.contains(e.target) && e.target !== sidebarToggle) {
                sidebar.classList.add('-translate-x-full');
                sidebar.classList.remove('shadow-lg');
            }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                sidebar.classList.remove('-translate-x-full');
            }
        });

        // Save button handler
        const saveBtn = document.getElementById('save-btn');
        if (saveBtn) {
            saveBtn.addEventListener('click', () => {
                alert('Saved successfully!');
            });
        }
    </script>
</body>
</html>
