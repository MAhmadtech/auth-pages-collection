<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="/output.css" rel="stylesheet">
    <title>Contact Us</title>
</head>

<body class="bg-stone-50">
    <!-- Background decorative blurs -->
    <div class="fixed w-96 h-96 -left-36 top-8 opacity-20 bg-teal-900 rounded-full blur-[151px] pointer-events-none"></div>
    <div class="fixed w-96 h-96 right-0 top-48 opacity-20 bg-teal-900 rounded-full blur-[151px] pointer-events-none hidden lg:block"></div>
    
    <!-- Main container -->
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="w-full px-4 sm:px-6 lg:px-8 py-6">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <!-- Logo -->
                <div class="flex items-center gap-3">
                    <img src="/Cart assets/Logo (1).svg" alt="Logo" class="w-12 h-12">
                    <div class="text-teal-900 text-xl sm:text-2xl lg:text-3xl font-bold font-['Inter'] uppercase hidden sm:block">
                        Logo Here
                    </div>
                </div>
                
                <!-- Auth buttons -->
                <div class="flex items-center gap-2 sm:gap-3">
                    <button class="px-4 sm:px-8 py-2.5 rounded-lg shadow-[0px_2px_4px_0px_rgba(0,0,0,0.10)] outline outline-1 outline-offset-[-1px] outline-teal-900 text-teal-900 text-sm font-normal font-['Poppins'] hover:bg-teal-50 transition-colors">
                        Login
                    </button>
                    <button class="px-4 sm:px-8 py-2.5 bg-teal-900 rounded-lg shadow-[0px_2px_4px_0px_rgba(0,0,0,0.10)] text-stone-50 text-sm font-normal font-['Poppins'] hover:bg-teal-800 transition-colors">
                        Sign up
                    </button>
                </div>
            </div>
        </header>
        
        <!-- Main content -->
        <main class="flex-1 w-full px-4 sm:px-6 lg:px-8 py-6 sm:py-8 lg:py-12">
            <div class="max-w-7xl mx-auto">
                <!-- Content card -->
                <div class="bg-white rounded-2xl shadow-[0px_4px_26px_0px_rgba(28,14,61,0.04)] border border-zinc-600/10 p-6 sm:p-8 lg:p-12">
                    <!-- Contact form -->
                    <div class="flex flex-col gap-6 sm:gap-8">
                        <!-- Title -->
                        <h1 class="text-teal-900 text-2xl sm:text-3xl font-extrabold font-['Urbanist'] leading-9">
                            Contact us
                        </h1>
                        
                        <!-- Divider -->
                        <div class="w-full h-px bg-black opacity-20"></div>
                        
                        <!-- Form -->
                        <form class="flex flex-col gap-6 sm:gap-8">
                            <!-- Two column inputs on desktop -->
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <!-- First input -->
                                <div class="flex flex-col gap-2">
                                    <label for="name" class="text-teal-900 text-sm sm:text-base font-normal font-['Urbanist'] opacity-70">
                                        Name
                                    </label>
                                    <input 
                                        type="text" 
                                        id="name" 
                                        name="name" 
                                        placeholder="Your Name"
                                        class="w-full h-11 px-4 bg-zinc-300 bg-opacity-20 rounded-md text-teal-900 text-sm font-normal font-['Urbanist'] placeholder:text-teal-900 placeholder:opacity-30 focus:outline-none focus:ring-2 focus:ring-teal-900 focus:ring-opacity-50"
                                    >
                                </div>
                                
                                <!-- Second input -->
                                <div class="flex flex-col gap-2">
                                    <label for="email" class="text-teal-900 text-sm sm:text-base font-normal font-['Urbanist'] opacity-70">
                                        Email
                                    </label>
                                    <input 
                                        type="email" 
                                        id="email" 
                                        name="email" 
                                        placeholder="your.email@example.com"
                                        class="w-full h-11 px-4 bg-zinc-300 bg-opacity-20 rounded-md text-teal-900 text-sm font-normal font-['Urbanist'] placeholder:text-teal-900 placeholder:opacity-30 focus:outline-none focus:ring-2 focus:ring-teal-900 focus:ring-opacity-50"
                                    >
                                </div>
                            </div>
                            
                            <!-- Message textarea -->
                            <div class="flex flex-col gap-2">
                                <label for="message" class="text-teal-900 text-sm sm:text-base font-normal font-['Urbanist'] opacity-70">
                                    Message
                                </label>
                                <textarea 
                                    id="message" 
                                    name="message" 
                                    rows="8"
                                    placeholder="Your message here..."
                                    class="w-full px-4 py-3 bg-zinc-300 bg-opacity-20 rounded-md text-teal-900 text-sm font-normal font-['Urbanist'] placeholder:text-teal-900 placeholder:opacity-30 focus:outline-none focus:ring-2 focus:ring-teal-900 focus:ring-opacity-50 resize-none"
                                ></textarea>
                            </div>
                            
                            <!-- Submit button -->
                            <div class="flex justify-end">
                                <button 
                                    type="submit"
                                    class="px-6 sm:px-8 py-2.5 bg-teal-900 rounded-lg shadow-[0px_2px_4px_0px_rgba(0,0,0,0.10)] text-stone-50 text-sm font-normal font-['Poppins'] hover:bg-teal-800 transition-colors"
                                >
                                    Contact
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Footer -->
        <footer class="w-full px-4 sm:px-6 lg:px-8 py-6">
            <div class="max-w-7xl mx-auto">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 sm:gap-6">
                    <!-- Copyright and links -->
                    <div class="flex flex-col sm:flex-row items-center gap-3 sm:gap-5">
                        <div class="text-zinc-800 text-xs font-medium font-['Urbanist'] leading-none">
                            Copyright 2025 book.com
                        </div>
                        <div class="flex items-center gap-3 sm:gap-4">
                            <a href="#" class="text-stone-300 text-xs font-normal font-['Urbanist'] leading-none hover:text-teal-900 transition-colors">
                                Privacy Policy
                            </a>
                            <a href="#" class="text-stone-300 text-xs font-normal font-['Urbanist'] leading-none hover:text-teal-900 transition-colors">
                                Term and conditions
                            </a>
                            <a href="#" class="text-stone-300 text-xs font-normal font-['Urbanist'] leading-none hover:text-teal-900 transition-colors">
                                Contact
                            </a>
                        </div>
                    </div>
                    
                    <!-- Social icons -->
                    <div class="flex items-center gap-3">
                        <a href="#" class="text-gray-400 hover:text-teal-900 transition-colors">
                            <img src="/Buyer Dashboard images/FacebookLogo.svg" alt="Facebook" class="w-5 h-5">
                        </a>
                        <a href="#" class="text-gray-400 hover:text-teal-900 transition-colors">
                            <img src="/Buyer Dashboard images/TwitterLogo.svg" alt="Twitter" class="w-5 h-5">
                        </a>
                        <a href="#" class="text-gray-400 hover:text-teal-900 transition-colors">
                            <img src="/Buyer Dashboard images/InstagramLogo.svg" alt="Instagram" class="w-5 h-5">
                        </a>
                        <a href="#" class="text-gray-400 hover:text-teal-900 transition-colors">
                            <img src="/Buyer Dashboard images/YoutubeLogo.svg" alt="YouTube" class="w-5 h-5">
                        </a>
                        <a href="#" class="text-gray-400 hover:text-teal-900 transition-colors">
                            <img src="/Buyer Dashboard images/LinkedinLogo.svg" alt="LinkedIn" class="w-5 h-5">
                        </a>
                    </div>
                </div>
            </div>
        </footer>
    </div>
</body>

</html>
