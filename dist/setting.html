          <!-- Settings Form -->

            <!-- Passwords -->

                <a href="#" class="hover:opacity-80 transition-opacity p-1"><img src="/assets/twitter-logo.svg" alt="Twitter" class="w-4 h-4"></a>
                <a href="#" class="hover:opacity-80 transition-opacity p-1"><img src="/assets/instagram-logo.svg" alt="Instagram" class="w-4 h-4"></a>

                <a href="#" class="hover:opacity-80 transition-opacity p-1"><img src="/assets/linkedin-logo.svg" alt="LinkedIn" class="w-4 h-4"></a>
              </div>
            </div>
          </div>
        </footer>

  <script>
    const phoneInput = document.querySelector("#phone");
    const iti = window.intlTelInput(phoneInput, {
        initialCountry: "us",
        separateDialCode: true,
        preferredCountries: ["us", "gb", "ca"],
        utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js"
    });

    // Handle form submission
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();
        const phoneNumber = iti.getNumber();
        console.log("Phone number:", phoneNumber);
        // Add your form submission logic here
    });
</script>

  <script>
    
    // Enhanced Mobile Menu
    document.addEventListener('DOMContentLoaded', function() {
      const mobileMenuButton = document.getElementById('mobileMenuButton');
      const mobileMenuClose = document.getElementById('mobileMenuClose');
      const mobileMenu = document.getElementById('mobileMenu');
      const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
      
      function openMobileMenu() {
        mobileMenu.classList.remove('hidden', '-translate-x-full');
        mobileMenuOverlay.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      }
      
      function closeMobileMenu() {
        mobileMenu.classList.add('-translate-x-full');
        mobileMenuOverlay.classList.add('hidden');
        document.body.style.overflow = '';
        setTimeout(() => {
          if (mobileMenu.classList.contains('-translate-x-full')) {
            mobileMenu.classList.add('hidden');
          }
        }, 300);
      }
      
      if (mobileMenuButton) {
        mobileMenuButton.addEventListener('click', openMobileMenu);
      }
      
      if (mobileMenuClose) {
        mobileMenuClose.addEventListener('click', closeMobileMenu);
      }
      
      if (mobileMenuOverlay) {
        mobileMenuOverlay.addEventListener('click', closeMobileMenu);
      }
      
      // Close menu on escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && !mobileMenu.classList.contains('hidden')) {
          closeMobileMenu();
        }
      });
      
      // Handle window resize
      window.addEventListener('resize', function() {
        if (window.innerWidth >= 768 && !mobileMenu.classList.contains('hidden')) {
          closeMobileMenu();
        }
      });
    });
  </script>
</body>
